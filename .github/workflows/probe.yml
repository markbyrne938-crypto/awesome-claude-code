name: probe
# Temporary: checks which GitHub-hosted runner types can start jobs in this repo.
on:
  push:
    branches: [claude/youtube-channel-tracker-g5iqmt]
    paths: [".github/workflows/probe.yml"]
jobs:
  runner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04, ubuntu-slim]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: echo "got a ${{ matrix.os }} runner at $(date -u)"
