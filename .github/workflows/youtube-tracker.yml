name: YouTube tracker website
# GitHub's own cron is best-effort (and doesn't reliably fire at all in forks), so each run
# starts the next one ~10 minutes later. The cron line is only a backup to restart the chain.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["youtube-tracker/**"]
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: youtube-tracker
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python youtube-tracker/fetch_videos.py
      - name: Save newly found channel IDs
        # videos.json is published straight to the site, not committed: committing it
        # every 10 minutes would flood the repo history.
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add youtube-tracker/channels.json
          git diff --cached --quiet || (git commit -m "Save channel IDs [skip ci]" && git push)
      - run: mkdir site && cp youtube-tracker/index.html youtube-tracker/videos.json site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4

  next:
    # Runs even if the build failed, so one bad run (e.g. YouTube hiccup) never ends the chain.
    needs: build
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait until 10 minutes after this run started
        run: |
          start=$(date -d "${{ github.run_started_at }}" +%s)
          wait=$(( start + 590 - $(date +%s) ))
          [ "$wait" -gt 0 ] && sleep "$wait" || true
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run youtube-tracker.yml --repo "${{ github.repository }}" --ref main
