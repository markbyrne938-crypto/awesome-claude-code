name: YouTube tracker website
# A normal scheduled refresh: each run takes ~30 seconds. GitHub runs it every 10 minutes
# when it can (it may delay scheduled runs at busy times).
# Do NOT bring back a self-restarting chain with sleeping jobs: keeping a runner busy around
# the clock gets the account's hosted runners blocked.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["youtube-tracker/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: youtube-tracker
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python youtube-tracker/fetch_videos.py
      - name: Save newly found channel IDs
        # videos.json is published straight to the site, not committed: committing it
        # every 10 minutes would flood the repo history.
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add youtube-tracker/channels.json
          git diff --cached --quiet || (git commit -m "Save channel IDs [skip ci]" && git push)
      - run: mkdir site && cp youtube-tracker/index.html youtube-tracker/videos.json site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
