name: YouTube tracker website
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["youtube-tracker/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: youtube-tracker
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python youtube-tracker/fetch_videos.py
      - name: Save latest data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add youtube-tracker/videos.json youtube-tracker/channels.json
          git diff --cached --quiet || (git commit -m "Update YouTube videos [skip ci]" && git push)
      - run: mkdir site && cp youtube-tracker/index.html youtube-tracker/videos.json site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
