name: Update YouTube tracker
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python youtube-tracker/fetch_videos.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add youtube-tracker/videos.json youtube-tracker/channels.json
          git diff --cached --quiet || (git commit -m "Update YouTube videos" && git push)
