<title>Back Road Europe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,500;0,700;0,900;1,500&family=Overpass+Mono:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: a road-atlas sheet beside a run of road signs. The map is the hero; it pans from city to city as you drive. */
:root {
  --bg: #edf0f2;
  --surface: #ffffff;
  --ink: #15202b;
  --muted: #566573;
  --border: #c3ccd4;
  --sign: #1b4b9b;
  --sign-ink: #ffffff;
  --eroad: #1c7449;
  --marking: #f2c230;
  --marking-ink: #2a2100;
  --bad: #b93a2c;
  --sea: #c6dbe8;
  --sea-ink: #6f93aa;
  --land: #f7f5ee;
  --land-edge: #8fa2ae;
  --frontier: #c9c3b4;
  --grat: #b2cbdb;
  --road: #2b3440;
  --odo: #1a222b;
  --display: "Overpass", "Helvetica Neue", Arial, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Overpass Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --surface: #1f2831; --ink: #eef2f5; --muted: #9ba8b4; --border: #35414d;
    --sign: #2456ad; --sign-ink: #ffffff; --eroad: #2c9462; --marking: #f2c230; --marking-ink: #2a2100; --bad: #e2675a;
    --sea: #121d28; --sea-ink: #4d6a80; --land: #27323d; --land-edge: #5b6c7a; --frontier: #3d4a57; --grat: #1c2b39;
    --road: #0a0e12; --odo: #05080b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #1f2831; --ink: #eef2f5; --muted: #9ba8b4; --border: #35414d;
  --sign: #2456ad; --sign-ink: #ffffff; --eroad: #2c9462; --marking: #f2c230; --marking-ink: #2a2100; --bad: #e2675a;
  --sea: #121d28; --sea-ink: #4d6a80; --land: #27323d; --land-edge: #5b6c7a; --frontier: #3d4a57; --grat: #1c2b39;
  --road: #0a0e12; --odo: #05080b; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 900; font-size: clamp(1.5rem, 4vw, 2.1rem); line-height: 1; margin: 0; text-transform: uppercase; letter-spacing: -0.01em; }
h1 span { color: var(--sign); }
:root[data-theme="dark"] h1 span { color: var(--marking); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) h1 span { color: var(--marking); } }
.dash { display: flex; align-items: center; gap: 12px; }
.mode { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.odo { display: flex; align-items: center; gap: 2px; background: var(--odo); padding: 4px 8px 4px 4px; border-radius: 5px; }
.odo b { font-family: var(--mono); font-weight: 700; font-size: 1.05rem; color: #ffffff; background: #2f3a46; width: 1.15em; text-align: center; border-radius: 2px; line-height: 1.5; }
.odo i { font-family: var(--mono); font-style: normal; font-size: 0.7rem; color: var(--marking); margin-left: 6px; }

.layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; } }

/* map */
.map { position: relative; aspect-ratio: 10 / 9; max-width: 100%; background: var(--sea); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
@media (max-width: 860px) { .map { aspect-ratio: 4 / 3; } }
@media (min-width: 861px) { .map { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); } }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.grat { fill: none; stroke: var(--grat); stroke-width: 1; vector-effect: non-scaling-stroke; }
.land { fill: var(--land); stroke: var(--land-edge); stroke-width: 0.9; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.frontier { fill: none; stroke: var(--frontier); stroke-width: 0.8; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.sea-name { fill: var(--sea-ink); font-family: var(--display); font-style: italic; font-weight: 500; font-size: 12px; letter-spacing: 0.2em; text-anchor: middle; text-transform: uppercase; }
.casing { fill: none; stroke: var(--road); stroke-width: 7; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
.centre { fill: none; stroke: var(--marking); stroke-width: 1.6; stroke-dasharray: 7 6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.dot { stroke: #ffffff; vector-effect: non-scaling-stroke; stroke-width: 2; }
.dot.ok { fill: var(--eroad); } .dot.no { fill: var(--bad); } .dot.home { fill: var(--road); }
.dot.up { fill: var(--land); stroke: var(--land-edge); stroke-width: 1.2; }
.dot.car { fill: var(--marking); stroke: var(--road); }
.ring { fill: none; stroke: var(--marking); stroke-width: 3; vector-effect: non-scaling-stroke; }
.ring2 { fill: none; stroke: var(--road); stroke-width: 6; vector-effect: non-scaling-stroke; opacity: .85; }
.lbl { font-family: var(--display); font-weight: 700; fill: var(--ink); stroke: var(--land); paint-order: stroke; stroke-linejoin: round; dominant-baseline: middle; }
@media (prefers-reduced-motion: no-preference) {
  .ring { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
}
.tag { position: absolute; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; font-family: var(--mono); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; }
.tag.top { top: 10px; } .tag.bot { bottom: 10px; }
.tag span { background: var(--odo); color: #ffffff; padding: 3px 8px 2px; border-radius: 4px; min-width: 0; }
.tag span:empty { display: none; }
.tag .y { background: var(--marking); color: var(--marking-ink); }

/* panel */
.panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stops { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; list-style: none; margin: 0; padding: 0; }
.stops li { height: 6px; border-radius: 3px; background: var(--border); }
.stops li.ok { background: var(--eroad); } .stops li.no { background: var(--bad); } .stops li.now { background: var(--marking); }

.sign { background: var(--sign); color: var(--sign-ink); border-radius: 12px; padding: 6px; }
.sign-inner { border: 2px solid var(--sign-ink); border-radius: 7px; padding: 18px 18px 22px; display: flex; flex-direction: column; gap: 12px; }
.eroad { align-self: flex-start; background: var(--eroad); color: #ffffff; border: 2px solid #ffffff; border-radius: 4px; font-family: var(--display); font-weight: 700; font-size: 0.85rem; padding: 2px 8px 0; letter-spacing: 0.04em; }
.q { font-family: var(--display); font-weight: 700; font-size: clamp(1.2rem, 2.4vw, 1.5rem); line-height: 1.2; margin: 0; text-wrap: balance; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt {
  min-width: 0; text-align: left; cursor: pointer; background: var(--surface); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 7px; padding: 12px 12px 10px;
  font-family: var(--display); font-weight: 500; font-size: 1.02rem; line-height: 1.2;
  display: flex; align-items: center; gap: 10px; overflow-wrap: anywhere;
}
.opt kbd { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; flex: none; }
@media (hover: hover) {
  .opt:hover:not(:disabled) { background: var(--marking); color: var(--marking-ink); border-color: var(--marking-ink); }
  .opt:hover:not(:disabled) kbd { color: var(--marking-ink); border-color: var(--marking-ink); }
}
.opt:disabled { cursor: default; opacity: .5; }
.opt.right { background: var(--eroad); color: #ffffff; border-color: var(--eroad); opacity: 1; }
.opt.wrong { background: var(--bad); color: #ffffff; border-color: var(--bad); opacity: 1; }
.opt.right kbd, .opt.wrong kbd { color: #ffffff; border-color: #ffffff; }
button:focus-visible { outline: 3px solid var(--marking); outline-offset: 2px; }

.after { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; min-height: 48px; }
.fact { margin: 0; flex: 1 1 240px; min-width: 0; color: var(--muted); }
.fact b { color: var(--ink); }
.go { cursor: pointer; border: 0; border-radius: 7px; background: var(--marking); color: var(--marking-ink); font-family: var(--display); font-weight: 700; font-size: 1rem; padding: 12px 20px 10px; text-transform: uppercase; letter-spacing: 0.04em; }
.go.alt { background: transparent; color: var(--ink); border: 2px solid var(--ink); padding: 10px 18px 8px; }
.note { font-size: 0.85rem; color: var(--muted); margin: 0; }

/* end */
.big { font-family: var(--display); font-weight: 900; font-size: clamp(2.4rem, 6vw, 3.4rem); line-height: 1; margin: 0; font-variant-numeric: tabular-nums; }
.big small { font-size: 1rem; font-weight: 700; opacity: .85; white-space: nowrap; }
.verdict { margin: 0; font-size: 1.05rem; }
.itin { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.itin li { display: grid; grid-template-columns: 1.4em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--border); }
.itin .m { font-weight: 700; } .itin .m.ok { color: var(--eroad); } .itin .m.no { color: var(--bad); }
.itin .c { font-family: var(--display); font-weight: 700; } .itin .c small { font-family: var(--body); font-weight: 400; color: var(--muted); font-size: 0.85rem; }
.itin .k { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.itin .k.lost { text-decoration: line-through; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
#sharebox { width: 100%; font-family: var(--mono); }

/* rarity tiers: the rarer the answer, the smaller the road */
:root { --back: #d9772b; --track: #8a5a33; }
.t0 { --tc: var(--muted); --tk: #ffffff; } .t1 { --tc: var(--sign); --tk: #ffffff; } .t2 { --tc: var(--eroad); --tk: #ffffff; }
.t3 { --tc: var(--marking); --tk: var(--marking-ink); } .t4 { --tc: var(--back); --tk: #ffffff; } .t5 { --tc: var(--track); --tk: #ffffff; }
.stops { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 1fr; }
.stops li[class^="t"] { background: var(--tc); }
.dot[class*=" t"] { fill: var(--tc); }
.ask { display: flex; gap: 10px; }
.ask input { flex: 1; min-width: 0; font-family: var(--display); font-weight: 500; font-size: 1.15rem; padding: 12px 14px 10px; border: 2px solid var(--ink); border-radius: 7px; background: var(--surface); color: var(--ink); }
.ask input:focus-visible { outline: 3px solid var(--marking); outline-offset: 2px; }
.clock { display: flex; align-items: center; gap: 10px; }
.bar { flex: 1; height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--marking); border-radius: 4px; }
.bar.low i { background: var(--bad); }
.secs { font-family: var(--mono); font-weight: 700; font-size: 0.9rem; width: 2.4em; text-align: right; font-variant-numeric: tabular-nums; }
.msg { margin: 0; min-height: 1.5em; color: var(--bad); font-weight: 600; }
.res { display: flex; flex-direction: column; gap: 8px; border: 2px solid var(--ink); border-radius: 7px; background: var(--surface); padding: 14px 16px; }
.res-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.res-name { font-family: var(--display); font-weight: 900; font-size: 1.5rem; line-height: 1.1; }
.res-pts { font-family: var(--mono); font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.chip { display: inline-block; background: var(--tc); color: var(--tk); font-family: var(--display); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 8px 1px; border-radius: 4px; white-space: nowrap; }
.res p { margin: 0; color: var(--muted); }
.rules { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.itin li { grid-template-columns: minmax(0, 1fr) auto; }
.itin .pq { grid-column: 1 / -1; font-size: 0.85rem; color: var(--muted); }
.itin .right { display: flex; gap: 8px; align-items: baseline; }

/* head to head */
.vs { border: 2px solid var(--ink); border-radius: 7px; background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.vs + .vs { margin-top: 12px; }
.vs h3 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 1.3rem; line-height: 1.15; }
.vs-head, .vs-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.vs-head { font-family: var(--mono); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.vs-q { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
.vs-cell { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-width: 0; }
.vs-cell b { font-family: var(--display); min-width: 0; overflow-wrap: anywhere; }
#rival input { font-size: 0.95rem; font-family: var(--mono); }

/* round of improvements: tools, visited countries, reveal, record */
.dash { flex-wrap: wrap; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tool { cursor: pointer; background: transparent; border: 1px solid var(--border); color: var(--ink); border-radius: 5px; font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 5px 8px 4px; }
.tool:hover { border-color: var(--ink); }
.vis { fill: var(--tc); opacity: 0.42; stroke: none; }
@media (max-width: 860px) { .playing .map { aspect-ratio: 16 / 9; } }
dialog { border: 2px solid var(--ink); border-radius: 12px; background: var(--bg); color: var(--ink); padding: 20px; width: min(480px, calc(100vw - 32px)); max-height: 85vh; overflow: auto; }
dialog::backdrop { background: rgba(10, 14, 18, 0.6); }
#dlgBody { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
#dlgBody h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 1.5rem; text-transform: uppercase; line-height: 1.1; }
#dlgBody h3 { margin: 6px 0 0; font-family: var(--display); font-weight: 700; font-size: 1rem; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stats div { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 10px 6px; text-align: center; }
.stats b { font-family: var(--display); font-weight: 900; font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats span { font-size: 0.75rem; color: var(--muted); }
.dist { display: grid; grid-template-columns: 8.5em minmax(0, 1fr) 2em; gap: 8px; align-items: center; }
.dist .chip { text-align: center; }
.dist .k, .arch .k { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); text-align: right; }
.arch li { align-items: center; }
.go.sm { padding: 5px 12px 3px; font-size: 0.8rem; }
.strip { position: relative; height: 16px; border-radius: 4px; margin-top: 4px; background: linear-gradient(90deg, var(--sign), var(--eroad), var(--marking), var(--back), var(--track)); }
.strip i { position: absolute; top: 3px; bottom: 3px; width: 2px; margin-left: -1px; background: rgba(255, 255, 255, 0.75); }
.strip i.me { top: -4px; bottom: -4px; width: 7px; margin-left: -3.5px; background: var(--ink); border: 1.5px solid var(--surface); border-radius: 3px; }
.strip-ends { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 0.68rem; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; }
details.all summary { cursor: pointer; font-weight: 600; color: var(--ink); }
details.all .legend { margin-top: 8px; }
.chip.mine { outline: 3px solid var(--ink); outline-offset: 1px; }
.legend .chip { white-space: normal; }
#tries { min-height: 1.4em; }
.vs .k { font-family: var(--mono); font-weight: 700; }
@media (prefers-reduced-motion: no-preference) {
  .shake { animation: shake 0.25s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .bar.low i { animation: blink 0.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.45; } }
}
</style>

<div class="wrap">
  <header>
    <h1>Back Road <span>Europe</span></h1>
    <div class="dash"><div class="tools"><button class="tool" id="help">How to play</button><button class="tool" id="stats">Record</button><button class="tool" id="mute"></button></div>
      <span class="mode" id="mode"></span>
      <div class="odo" id="odo" aria-label="Points"></div>
    </div>
  </header>

  <div class="layout">
    <div class="map" id="map">
      <svg id="svg" role="img" aria-label="Map of Europe showing your route"><g id="base"></g><g id="dyn"></g></svg>
      <div class="tag top"><span id="tagL"></span><span id="tagR" class="y"></span></div>
      <div class="tag bot"><span id="tagB"></span></div>
    </div>
    <div class="panel">
      <ol class="stops" id="stops" aria-label="Stops"></ol>
      <main id="stage"></main>
      <p class="note" id="note"></p><form class="ask" id="rival" autocomplete="off"><input id="code" type="text" aria-label="A friend&#39;s result code" placeholder="Paste a friend&#39;s result code" spellcheck="false"><button class="go alt">Compare</button></form><p class="note" id="rmsg" aria-live="polite"></p>
    </div>
  </div>
</div>

<dialog id="dlg"><div id="dlgBody"></div><div><button class="go" id="dlgClose">Close</button></div></dialog>
<script>

// An answer is Name,alias,alias[:how readily it comes to mind 1-10[:country]]. Unlisted fame is 1.

Name a Greek island.;An island;GR;Crete:10|Santorini,Thira:9|Mykonos:8|Rhodes:8|Corfu,Kerkyra:8|Kos:6|Zakynthos,Zante:6|Kefalonia,Cephalonia:5|Naxos:4|Paros:4|Lesbos,Lesvos:4|Ios:3|Skiathos:3|Samos:3|Milos:3|Ithaca:3|Chios:2|Lefkada:2|Hydra:2|Skopelos:2|Patmos:2|Karpathos|Aegina|Thassos|Euboea,Evia|Symi|Delos|Andros|Tinos|Syros|Folegandros|Amorgos|Antiparos|Spetses|Kalymnos|Lemnos|Ikaria|Kythira|Paxos|Sifnos|Serifos|Alonissos|Skyros|Leros|Samothrace

/* ---- hand-written prompts on food, sport, places and culture ---- */
const HAND = CURATED.trim().split("\n").map(line => {
  const [q, hint, dcc, list] = line.split(";"), map = {};
  const items = list.split("|").map((it, i) => { const [names, f, cc] = it.split(":"), all = names.split(",");

/* ---- rarity: fewer people would say it, more points ---- */
const TIERS = ["No answer", "Motorway", "Main road", "Country road", "Back road", "Dirt track"], SQUARES = ["⬛", "🟦", "🟩", "🟨", "🟧", "🟫"];

function rate(p, k) {

const extremes = p => { const s = p.items.slice().sort((a, b) => b.f - a.f); return [s[0].label, s[s.length - 1].label]; };
const said = i => trip[i].items[S.ans[i].k];

let S, trip, vb, legT = 1, raf;

function deal(pool, n, salt, spare = 0) { // shuffled once per cycle and dealt a slice a day, so nothing repeats within a cycle
  const idx = pool.map((_, i) => i), slot = n + spare; let cand;

function build() { trip = shuffle([...deal(HAND, NCUR, 17), ...deal(POOL, NQ - NCUR, 29, 4)], rng(S.seed + 5)); }
const score = () => S.ans.reduce((s, a) => s + a.pts, 0);
const stops = () => S.ans.map((a, i) => ({ a, it: a.k >= 0 ? said(i) : null })).filter(x => x.it && x.it.cc);
const route = () => [D.start, ...stops().map(x => byId[x.it.cc])];
const routeKm = () => route().reduce((s, p, i, a) => s + (i ? km(a[i - 1], p) : 0), 0);
function save() { if (S.daily) try { localStorage.setItem("bre-run4", JSON.stringify(S)); } catch {} }

function frame(pts) {
  const el = $("map"), AR = (el.clientWidth / el.clientHeight) || 1.1, pad = 90;

function rest() {

  for (let i = 1; i <= (moving ? r - 1 : r); i++) { h += dot(pts[i], "t" + tiers[i - 1], 6.5); if (!seen.has(pts[i].id)) h += lbl(pts[i], pts[i].cap); seen.add(pts[i].id); }

}

function tick() {

const sign = (tag, body) => `<section class="sign"><div class="sign-inner"><span class="eroad">${tag}</span>${body}</div></section>`;

$("note").textContent = `${fmt(HAND.length + POOL.length)} prompts in the bank: ${HAND.length} hand-written on food, sport, places and culture, and ${fmt(POOL.length)} on countries and capitals. Seven are dealt every day at midnight Central European time, the same for everyone. Rarity is an estimate of how many players would give each answer, fixed in advance.`;

/* ---- small pleasures: flags, counting up, sound ---- */
let tried = [], lastSec = -1, AC = null, muted = false;
try { muted = localStorage.getItem("bre-mute") === "1"; } catch {}
const flag = cc => cc ? String.fromCodePoint(...[...cc].map(ch => 0x1F1A5 + ch.charCodeAt(0))) + " " : "";
function countUp(el, to, pre) {
  if (!el || reduced || !to) return; const t0 = performance.now();
  const step = now => { const t = Math.min(1, (now - t0) / 600); el.textContent = pre + Math.round(to * (1 - (1 - t) ** 3)); if (t < 1 && el.isConnected) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function beep(f, d, when = 0, type = "sine", vol = 0.08) {
  if (muted) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + when;
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d); } catch {}
}
function snd(kind, tier = 1) {
  if (kind === "tick") beep(880, 0.06, 0, "square", 0.03);
  else if (kind === "bad") beep(160, 0.12, 0, "sawtooth", 0.05);
  else if (kind === "out") { beep(220, 0.2, 0, "sawtooth", 0.05); beep(150, 0.35, 0.18, "sawtooth", 0.05); }
  else if (kind === "good") [0, 4, 7, 12, 16].slice(0, tier).forEach((x, i) => beep(440 * 2 ** (x / 12), 0.18, i * 0.09)); // rarer answers ring higher
  else if (kind === "done") [0, 4, 7, 12].forEach((x, i) => beep(523 * 2 ** (x / 12), 0.3, i * 0.12));
}
const muteLabel = () => { $("mute").textContent = muted ? "Sound off" : "Sound on"; $("mute").setAttribute("aria-pressed", String(!muted)); };
$("mute").addEventListener("click", () => { muted = !muted; try { localStorage.setItem("bre-mute", muted ? "1" : "0"); } catch {} muteLabel(); beep(660, 0.1); });
muteLabel();

/* ---- your record, kept in this browser ---- */
function hist() { try { return JSON.parse(localStorage.getItem("bre-hist")) || {}; } catch { return {}; } }
function record() {
  if (!S.daily) return; const h = hist(); if (h[S.day]) return;
  h[S.day] = { pts: score(), t: S.ans.map(a => a.k >= 0 ? tierOf(a.pts) : 0) };
  try { localStorage.setItem("bre-hist", JSON.stringify(h)); } catch {}
}
function streak() { const h = hist(), today = cetNow().day; let d = h[today] ? today : today - 1, n = 0; while (h[d]) { n++; d--; } return n; }
function dialog(html) { const d = $("dlg"); $("dlgBody").innerHTML = html; if (!d.open) d.showModal(); }
$("dlgClose").addEventListener("click", () => $("dlg").close());
$("help").addEventListener("click", () => dialog(`<h2>How to play</h2>
  <ul class="rules">
    <li>Each route has ${NQ} prompts, and every prompt has several right answers.</li>
    <li>You get ${SECS} seconds to type one. Wrong tries cost nothing, so keep going until one counts.</li>
    <li>The fewer people who would think of your answer, the more it scores: 15 points for the obvious one, up to 100 for the rarest.</li>
    <li>Each answer drives you to the capital of the country it belongs to and colours that country on the map.</li>
    <li>Everyone gets the same route each day. A new one is dealt at midnight Central European time.</li>
    <li>To play someone, send them your result code when you finish, or paste theirs into the box under the game.</li>
  </ul>
  <div class="legend">${[1, 2, 3, 4, 5].map(t => `<span class="chip t${t}">${TIERS[t]}</span>`).join("")}</div>`));
$("stats").addEventListener("click", () => {
  const h = hist(), days = Object.keys(h).map(Number), today = cetNow().day, n = days.length;
  const sum = days.reduce((x, d) => x + h[d].pts, 0), best = Math.max(0, ...days.map(d => h[d].pts));
  const tc = [0, 0, 0, 0, 0, 0]; days.forEach(d => (h[d].t || []).forEach(t => tc[t]++)); const mx = Math.max(1, ...tc);
  let routes = "";
  for (let d = today; d >= Math.max(DAY1, today - 13); d--) routes += `<li><span class="c">Route #${d - DAY1 + 1}${d === today ? " (today)" : ""}</span>` +
    (h[d] ? `<span class="k">${h[d].pts} pts</span>` : S.daily && S.day === d && S.phase !== "intro" ? `<span class="k">In progress</span>` : `<button class="go alt sm" data-day="${d}">Play</button>`) + "</li>";
  dialog(`<h2>Your record</h2>
    <div class="stats">${[["Played", n], ["Average", n ? Math.round(sum / n) : 0], ["Best", best], ["Day streak", streak()]].map(([l, v]) => `<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>
    <h3>Roads taken</h3>${[5, 4, 3, 2, 1, 0].map(t => `<div class="dist"><span class="chip t${t}">${TIERS[t]}</span><div class="bar"><i class="t${t}" style="width:${(tc[t] / mx * 100).toFixed(0)}%;background:var(--tc)"></i></div><span class="k">${tc[t]}</span></div>`).join("")}
    <h3>Routes from the last two weeks</h3><ol class="itin arch">${routes}</ol>
    <p class="note">Your record is kept in this browser only.</p>`);
});
$("dlgBody").addEventListener("click", e => {
  const b = e.target.closest("button[data-day]"); if (!b) return;
  $("dlg").close(); const d = +b.dataset.day; if (d === cetNow().day) start({}); else newTrip(true, null, null, d);
});

function start(saved) {
  const today = cetNow().day, ok = s => s && s.seed != null && Array.isArray(s.ans) && s.phase && s.ans.every(a => a && typeof a.k === "number");
  let s = ok(saved) ? saved : null;
  if (!s) try { const t = JSON.parse(localStorage.getItem("bre-run4")); if (ok(t) && t.day === today) s = t; } catch {}
  if (s) { S = s; build(); vb = null; render("pan"); } else newTrip(true);
}
setInterval(() => S && tick(), 200);
connect();
window.claude?.hot?.snapshot?.(() => S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
