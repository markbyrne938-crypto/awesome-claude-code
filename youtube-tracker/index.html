<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My YouTube Watchlist</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#16181d; --muted:#656b76; --line:#e2e4e9; --accent:#e02b20; --accent-soft:#fde9e7; --ok:#1a8f4c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1012; --card:#1a1b1e; --text:#eceef2; --muted:#9aa0ab; --line:#2b2d31; --accent:#ff5f54; --accent-soft:#3a1c1a; --ok:#4ccf86; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .bar { max-width:1100px; margin:0 auto; padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
  h1 { font-size:20px; margin:0; margin-right:auto; }
  .sub { color:var(--muted); font-size:13px; }
  button, .seg label { font:inherit; font-size:14px; padding:7px 14px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--text); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.6; cursor:wait; }
  .seg { display:inline-flex; } .seg input { display:none; }
  .seg label { border-radius:0; margin-left:-1px; } .seg label:first-child { border-radius:999px 0 0 999px; margin:0; } .seg label:last-child { border-radius:0 999px 999px 0; }
  .seg input:checked + label { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600; position:relative; }
  .toggle { display:flex; gap:6px; align-items:center; font-size:14px; color:var(--muted); cursor:pointer; }
  .toggle input { accent-color:var(--accent); width:16px; height:16px; }
  .chips { max-width:1100px; margin:0 auto; padding:0 16px 12px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:thin; }
  .chip { flex:none; white-space:nowrap; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip small { opacity:.75; margin-left:4px; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .group { margin-bottom:26px; }
  .group h2 { font-size:17px; margin:0 0 10px; display:flex; align-items:center; gap:10px; }
  .group h2 .link { margin-left:auto; font-size:13px; font-weight:400; color:var(--muted); background:none; border:none; padding:0; text-decoration:underline; cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; transition:opacity .2s; }
  .card.watched { opacity:.45; }
  .thumb { position:relative; display:block; aspect-ratio:16/9; background:var(--line); }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .dur { position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.82); color:#fff; font-size:12px; font-weight:600; padding:2px 6px; border-radius:6px; }
  .body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .title { color:inherit; text-decoration:none; font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .title:hover { color:var(--accent); }
  .meta { color:var(--muted); font-size:13px; }
  .tick { margin-top:auto; display:flex; align-items:center; gap:10px; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; cursor:pointer; font-size:15px; font-weight:500; user-select:none; }
  .tick:hover { border-color:var(--ok); }
  .tick input { width:22px; height:22px; accent-color:var(--ok); cursor:pointer; margin:0; }
  .card.watched .tick { border-color:var(--ok); color:var(--ok); }
  .empty { background:var(--card); border:1px dashed var(--line); border-radius:14px; padding:28px 16px; text-align:center; color:var(--muted); }
  .empty.big { padding:48px 16px; } .empty b { color:var(--text); font-size:18px; display:block; margin-bottom:6px; }
  .err { color:var(--accent); }
  .toast { position:fixed; left:50%; bottom:20px; transform:translate(-50%,80px); background:#222; color:#fff; padding:10px 14px; border-radius:12px; display:flex; gap:14px; align-items:center; opacity:0; transition:.25s; z-index:9; max-width:92vw; }
  .toast.show { transform:translate(-50%,0); opacity:1; }
  .toast button { background:none; border:none; color:#ffb4ae; padding:0; font-weight:600; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:10px 16px 30px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div style="margin-right:auto"><h1>📺 My YouTube Watchlist</h1><div class="sub" id="status">Loading…</div></div>
    <div class="seg" role="radiogroup" aria-label="Layout">
      <input type="radio" name="view" id="v-channel" value="channel" checked><label for="v-channel">By channel</label>
      <input type="radio" name="view" id="v-new" value="new"><label for="v-new">Newest first</label>
    </div>
    <label class="toggle"><input type="checkbox" id="showWatched"> Show watched</label>
    <button id="refresh" class="primary">↻ Refresh</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="list"></main>
<footer>Ticks are saved in this browser only. New uploads are checked automatically every hour.</footer>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="undo">Undo</button></div>
<script>
const KEY = 'yt-watched', $ = id => document.getElementById(id);
let watched = new Set(), data = { channels: [] }, filter = 'all', lastAction = null, toastTimer;
try { watched = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
try { filter = localStorage.getItem('yt-filter') || 'all'; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...watched])); } catch (e) {} };

const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
function dur(s) {
  if (s == null) return '';
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`;
}
function ago(iso) {
  const mins = (Date.now() - new Date(iso)) / 60000;
  for (const [u, n] of [['year',525600],['month',43800],['week',10080],['day',1440],['hour',60],['minute',1]])
    if (mins >= n) { const v = Math.floor(mins / n); return `${v} ${u}${v > 1 ? 's' : ''} ago`; }
  return 'just now';
}
const isWatched = v => watched.has(v.id);

function card(v, showChannel) {
  const w = isWatched(v);
  return `<article class="card ${w ? 'watched' : ''}">
    <a class="thumb" href="${v.url}" target="_blank" rel="noopener"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg"><span class="dur">${dur(v.seconds)}</span></a>
    <div class="body">
      <a class="title" href="${v.url}" target="_blank" rel="noopener">${esc(v.title)}</a>
      <div class="meta">${showChannel ? `<b>${esc(v.channel)}</b> · ` : ''}${ago(v.published)} · ${new Date(v.published).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'})}</div>
      <label class="tick"><input type="checkbox" data-id="${v.id}" ${w ? 'checked' : ''}> ${w ? 'Watched' : 'Mark as watched'}</label>
    </div></article>`;
}

function render() {
  const showAll = $('showWatched').checked, view = document.querySelector('input[name=view]:checked').value;
  const chans = data.channels;
  if (!chans.length || !chans.some(c => c.videos.length || c.error)) {
    $('chips').innerHTML = '';
    $('list').innerHTML = `<div class="empty big"><b>No videos yet</b>The first automatic check hasn't run. Click “Refresh”, or see the README for the one-time setup.</div>`;
    return;
  }
  const left = c => c.videos.filter(v => !isWatched(v)).length;
  const total = chans.reduce((n, c) => n + left(c), 0);
  if (filter !== 'all' && !chans.some(c => c.name === filter)) filter = 'all';

  $('chips').innerHTML = `<button class="chip ${filter === 'all' ? 'on' : ''}" data-f="all">All<small>${total}</small></button>` +
    chans.map(c => `<button class="chip ${filter === c.name ? 'on' : ''}" data-f="${esc(c.name)}">${esc(c.name)}<small>${left(c)}</small></button>`).join('');

  const visible = chans.filter(c => filter === 'all' || c.name === filter);
  let html = '';
  if (view === 'new') {
    const all = visible.flatMap(c => c.videos.map(v => ({ ...v, channel: c.name })))
      .filter(v => showAll || !isWatched(v)).sort((a, b) => new Date(b.published) - new Date(a.published));
    html = all.length ? `<div class="grid">${all.map(v => card(v, true)).join('')}</div>` : allDone();
  } else {
    for (const c of visible) {
      const vids = c.videos.filter(v => showAll || !isWatched(v));
      if (!vids.length && filter === 'all' && !c.error) continue;   // hide finished channels in the main view
      html += `<section class="group"><h2>${esc(c.name)}<span class="sub">${left(c)} to watch</span>
        ${left(c) > 1 ? `<button class="link" data-all="${esc(c.name)}">Mark all watched</button>` : ''}</h2>` +
        (vids.length ? `<div class="grid">${vids.map(v => card(v, false)).join('')}</div>`
          : `<div class="empty ${c.error ? 'err' : ''}">${c.error ? 'Couldn’t load this channel: ' + esc(c.error) : 'All caught up ✓'}</div>`) + '</section>';
    }
    if (!html) html = allDone();
  }
  $('list').innerHTML = html;
  $('status').textContent = `${total} to watch` + (data.updated ? ` · checked ${ago(data.updated)}` : '');
}
const allDone = () => `<div class="empty big"><b>🎉 All caught up!</b>Nothing left to watch. New videos appear here automatically.</div>`;

function toast(msg, undo) {
  $('toastMsg').textContent = msg; lastAction = undo; $('toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 6000);
}
$('undo').onclick = () => { if (lastAction) lastAction(); $('toast').classList.remove('show'); save(); render(); };

$('list').addEventListener('change', e => {
  const id = e.target.dataset.id; if (!id) return;
  if (e.target.checked) { watched.add(id); toast('Marked as watched', () => watched.delete(id)); }
  else watched.delete(id);
  save(); render();
});
$('list').addEventListener('click', e => {
  const name = e.target.dataset.all; if (!name) return;
  const ids = data.channels.find(c => c.name === name).videos.filter(v => !isWatched(v)).map(v => v.id);
  ids.forEach(i => watched.add(i)); save(); render();
  toast(`Marked ${ids.length} videos as watched`, () => ids.forEach(i => watched.delete(i)));
});
$('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  filter = b.dataset.f; try { localStorage.setItem('yt-filter', filter); } catch (x) {} render();
});
document.querySelectorAll('input[name=view]').forEach(r => r.addEventListener('change', render));
$('showWatched').addEventListener('change', render);

async function load() {
  try { data = await (await fetch('videos.json', { cache: 'no-store' })).json(); render(); }
  catch (e) { $('status').textContent = 'Could not load video data'; }
}
$('refresh').addEventListener('click', async () => {
  const b = $('refresh'); b.disabled = true; b.textContent = 'Checking…';
  try { await fetch('refresh', { method: 'POST' }); } catch (e) {}   // only does something when run via serve.py
  await load(); b.disabled = false; b.textContent = '↻ Refresh';
});
load(); setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
