<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Watchlist</title>
<style>
  :root { --bg:#f6f6f7; --card:#fff; --text:#17181a; --muted:#6a6e75; --line:#e3e4e8; --accent:#d9261c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121314; --card:#1c1d1f; --text:#ececee; --muted:#9a9ea6; --line:#2e3033; --accent:#ff5a4f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif; }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; z-index:1;
           display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
  h1 { font-size:18px; margin:0; margin-right:auto; }
  header label { color:var(--muted); display:flex; gap:6px; align-items:center; cursor:pointer; }
  button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  main { max-width:860px; margin:0 auto; padding:16px; }
  #status { color:var(--muted); font-size:13px; margin-bottom:12px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden; }
  section h2 { font-size:15px; margin:0; padding:10px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
  section h2 .count { color:var(--muted); font-weight:400; }
  .video { display:flex; gap:12px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); }
  .video:last-child { border-bottom:0; }
  .video input { width:22px; height:22px; accent-color:var(--accent); flex:none; cursor:pointer; }
  .video img { width:128px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; flex:none; background:var(--line); }
  .info { min-width:0; }
  .info a { color:inherit; text-decoration:none; font-weight:600; }
  .info a:hover { color:var(--accent); }
  .meta { color:var(--muted); font-size:13px; margin-top:2px; }
  .video.watched { opacity:.5; }
  .video.watched .info a { text-decoration:line-through; }
  .empty, .err { padding:12px 14px; color:var(--muted); }
  .err { color:var(--accent); }
  @media (max-width:520px) { .video img { width:96px; } }
</style>
</head>
<body>
<header>
  <h1>📺 YouTube Watchlist</h1>
  <label><input type="checkbox" id="showWatched"> Show watched</label>
  <button id="refresh">Refresh</button>
</header>
<main>
  <div id="status">Loading…</div>
  <div id="list"></div>
</main>
<script>
const KEY = 'yt-watched';
let watched = new Set();
try { watched = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
let data = { channels: [] };
const $ = id => document.getElementById(id);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...watched])); } catch (e) {} };

function fmtDuration(s) {
  if (s == null) return '?';
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
}
function fmtAgo(iso) {
  const mins = (Date.now() - new Date(iso)) / 60000;
  const units = [['year', 525600], ['month', 43800], ['week', 10080], ['day', 1440], ['hour', 60], ['minute', 1]];
  for (const [u, n] of units) if (mins >= n) { const v = Math.floor(mins / n); return `${v} ${u}${v > 1 ? 's' : ''} ago`; }
  return 'just now';
}
function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function render() {
  const showAll = $('showWatched').checked;
  let html = '', unwatched = 0;
  for (const ch of data.channels) {
    const vids = ch.videos.filter(v => showAll || !watched.has(v.id));
    unwatched += ch.videos.filter(v => !watched.has(v.id)).length;
    html += `<section><h2>${esc(ch.name)}<span class="count">${ch.videos.filter(v => !watched.has(v.id)).length} to watch</span></h2>`;
    if (ch.error && !ch.videos.length) html += `<div class="err">Couldn't load: ${esc(ch.error)}</div>`;
    else if (!vids.length) html += `<div class="empty">All caught up ✓</div>`;
    for (const v of vids) {
      html += `<div class="video ${watched.has(v.id) ? 'watched' : ''}">
        <input type="checkbox" data-id="${v.id}" ${watched.has(v.id) ? 'checked' : ''} title="Mark as watched">
        <a href="${v.url}" target="_blank" rel="noopener"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt=""></a>
        <div class="info"><a href="${v.url}" target="_blank" rel="noopener">${esc(v.title)}</a>
          <div class="meta">${fmtDuration(v.seconds)} · ${fmtAgo(v.published)} · ${new Date(v.published).toLocaleDateString()}</div></div></div>`;
    }
    html += '</section>';
  }
  $('list').innerHTML = html;
  $('status').textContent = data.updated
    ? `${unwatched} unwatched · last checked ${fmtAgo(data.updated)}`
    : 'No data yet — click Refresh (or run fetch_videos.py).';
}

async function load() {
  try { data = await (await fetch('videos.json', { cache: 'no-store' })).json(); }
  catch (e) { $('status').textContent = 'Could not load videos.json'; return; }
  render();
}

$('list').addEventListener('change', e => {
  const id = e.target.dataset.id; if (!id) return;
  e.target.checked ? watched.add(id) : watched.delete(id);
  save(); render();
});
$('showWatched').addEventListener('change', render);
$('refresh').addEventListener('click', async () => {
  const b = $('refresh'); b.disabled = true; b.textContent = 'Refreshing…';
  try { await fetch('refresh', { method: 'POST' }); } catch (e) {}   // only works via serve.py
  await load(); b.disabled = false; b.textContent = 'Refresh';
});
load();
setInterval(load, 15 * 60 * 1000);
</script>
</body>
</html>
